[package]
name = "rustcare-core"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
winreg = "0.52"
sysinfo = "0.33"
walkdir = "2.5"
rayon = "1.10"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.17"
